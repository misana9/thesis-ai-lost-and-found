services:
  api:
    build: backend/
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Fine-tuned CLIP weights (host dataset/checkpoints → container /checkpoints)
      - ./dataset/checkpoints:/checkpoints:ro
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # Override host path from .env so the container loads the mounted checkpoint
      CLIP_FT_CHECKPOINT: /checkpoints/clip_ft_best.pt
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=jdeeza
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=lost_and_found
    volumes:
      # Must mount at PGDATA (/var/lib/postgresql/data). Mounting the parent
      # lets Docker create an anonymous volume for /data that is discarded on
      # container recreate — wiping the DB every restart.
      - postgres-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdeeza -d lost_and_found"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres-db:
